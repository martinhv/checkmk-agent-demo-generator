# Meridian Retail demo: run the WHOLE estate behind ONE delivery shell.
#   docker compose up --build -d          (or let ../../estate.py drive it)
#   docker compose logs -f
#
# One container runs the delivery shell + every estate host's serve.py as an
# internal child. By default (datasource mode) each host's agent output is
# written to a file the site reads via a "cat $HOSTNAME$" program; in piggyback
# mode (cloud) Checkmk polls only the shell (agent 6559) and the estate hosts
# arrive as piggyback blocks. Combined control panel on 8099.
#
# Build context is the repo root (the image needs every host's serve.py).
services:
  cmk-demo-gateway:
    build:
      context: ../..
      dockerfile: deploy/delivery/Dockerfile
    # fixed tag so estate.py can run netsim (the SNMP responder) from the SAME
    # image as a sibling container (it has snmp/netsim.py + walklib baked in)
    image: cmk-demo-estate:latest
    container_name: cmk-demo-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:6559:6556"   # Check_MK agent (the delivery shell)
      - "127.0.0.1:8099:8080"   # combined estate control panel
    environment:
      # estate.py sets these; empty = all hosts, no replication
      ESTATE_HOSTS: "${ESTATE_HOSTS:-}"
      ESTATE_REPLICAS: "${ESTATE_REPLICAS:-1}"
      # company scale: also run fleet/serve.py (the ~140-host steady-green bulk)
      ESTATE_FLEET: "${ESTATE_FLEET:-0}"
      # delivery mode: piggyback (default) or datasource (self-hosted). In
      # datasource mode the per-host agent files are written to /agent-output,
      # bind-mounted to the host so the site's "cat" datasource program can
      # read them (the container writes them world-readable).
      DELIVERY_MODE: "${DELIVERY_MODE:-piggyback}"
      AGENT_OUTPUT_DIR: "/agent-output"
    volumes:
      - "${ESTATE_AGENT_OUTPUT_DIR:-/var/tmp/cmk-demo-agent-output}:/agent-output"
# Defaults: DELIVERY_HOSTNAME = cmk-demo-gateway.corp.meridian-retail.com (FQDN,
# derived from ESTATE_DOMAIN).
