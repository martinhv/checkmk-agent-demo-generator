# Meridian Retail demo: leaf-sw-01 — Cumulus Linux ToR access switch, steady green.
#   docker compose up --build -d
#   docker compose logs -f
#
# Published on 127.0.0.1 as 6569 (agent) / 8100 (admin — 8099 is taken by the
# piggyback delivery control panel). In Checkmk, add the host with IP 127.0.0.1
# and set the "Checkmk agent port" override to 6569.
services:
  leaf-sw-01:
    build: .
    container_name: leaf-sw-01
    restart: unless-stopped
    ports:
      - "127.0.0.1:6569:6569"   # Check_MK agent (published port)
      - "127.0.0.1:8100:8100"   # admin status UI (published port)
    environment:
      STATE_FILE: /var/tmp/cmk-demo-leaf-sw-01.json
