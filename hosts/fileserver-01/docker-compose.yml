# Meridian Retail demo: fileserver-01 — filesystem filling -> df trend + CRIT.
#   docker compose up --build -d
#   docker compose logs -f
#
# Published on 127.0.0.1 as 6563 (agent) / 8093 (admin). In Checkmk, add the
# host with IP 127.0.0.1 and set the "Checkmk agent port" override to 6563.
services:
  fileserver-01:
    build: .
    container_name: fileserver-01
    restart: unless-stopped
    ports:
      - "127.0.0.1:6563:6556"   # Check_MK agent
      - "127.0.0.1:8093:8080"   # admin toggle/UI
    environment:
      START_STATE: healthy
