# Meridian Retail demo: web-frontend-01 — nginx reverse proxy, steady green.
#   docker compose up --build -d
#   docker compose logs -f
#
# Published on 127.0.0.1 as 6560 (agent) / 8090 (admin). In Checkmk, add the
# host with IP 127.0.0.1 and set the "Checkmk agent port" override to 6560.
services:
  web-frontend-01:
    build: .
    container_name: web-frontend-01
    restart: unless-stopped
    ports:
      - "127.0.0.1:6560:6556"   # Check_MK agent (published port)
      - "127.0.0.1:8090:8080"   # admin status UI (published port)
    environment:
      STATE_FILE: /var/tmp/cmk-demo-web-frontend-state.json
