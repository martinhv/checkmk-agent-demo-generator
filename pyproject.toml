# Dev-tooling only. This project ships stdlib-only runtime code (estate.py +
# deploy/ snmp/ fleet/ hosts/ are run in place, not installed), so there are NO
# runtime dependencies and the project itself is not a package — uv just manages
# the dev toolchain (ruff, basedpyright, pytest, prek). Mirrors ~/git/hop.

[project]
name = "checkmk-agent-demo-generator"
version = "0.1.0"
description = "Fake Checkmk agent/SNMP hosts for building demo estates."
readme = "README.md"
requires-python = ">=3.12"
authors = []
dependencies = []                      # runtime is stdlib-only, by design

[tool.uv]
package = false                        # scripts, not an installable package

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "prek>=0.4.8",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
# Kill anything that hangs (the responder/panel tests bind sockets); dump the
# offending test's stack instead of blocking the run.
timeout = 60
# Coverage is measured but NOT gated yet — add --cov-fail-under=NN once there
# are real tests (mirrors hop, which enforces 75%).
addopts = "--cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["snmp", "deploy", "fleet"]   # estate.py + hosts/ are exercised e2e, not unit-tested
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]

[tool.basedpyright]
# "standard" and CLEAN at error level (no rule downgrades) — the whole codebase
# type-checks. hop runs "strict"; the remaining gap to strict is annotating
# every param/return + the untyped JSON dicts, a larger effort left for later.
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportUnusedExpression = "error"   # caught a real dead-code line; keep it hard
# The code runs with these dirs on sys.path (estate.py inserts deploy/, netsim
# imports snmpserver, fleet/serve imports profiles) — mirror that so imports
# resolve statically instead of tripping reportMissingImports.
extraPaths = ["snmp", "deploy", "fleet"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
# Intentional (not a backlog): this is a data generator — modules embed long
# agent-section / SNMP-walk / HTML-panel literals and aligned help text where a
# hard 100-col wrap hurts readability and risks corrupting the emitted data.
# Everything else in the ruleset above is enforced.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# tests deliberately import repo modules after a sys.path insert
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["snmpserver", "netsim", "profiles", "cmk_setup"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
