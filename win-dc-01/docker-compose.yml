# Meridian Retail demo: win-dc-01 — Windows Server 2022 AD DC, C: drive fills up.
#   docker compose up --build -d
#   docker compose logs -f
#
# Published on 127.0.0.1 as 6567 (agent) / 8097 (admin). In Checkmk, add the
# host with IP 127.0.0.1, agent port override 6567. The agent emits Windows
# sections — Checkmk treats it as a Windows host.
services:
  win-dc-01:
    build: .
    container_name: win-dc-01
    restart: unless-stopped
    ports:
      - "127.0.0.1:6567:6556"   # Check_MK agent (Windows format)
      - "127.0.0.1:8097:8080"   # admin toggle/UI
    environment:
      CMK_HOSTNAME: win-dc-01
      START_STATE: healthy
